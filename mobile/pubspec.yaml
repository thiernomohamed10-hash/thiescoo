name: thiescoo
description: Advanced Binary Options Trading Bot with ML
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  provider: ^6.0.0
  get_it: ^7.6.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.18.1
  fl_chart: ^0.63.0
  tradingview_flutter: ^1.0.0
  uuid: ^4.0.0
  logger: ^1.4.0
  dio: ^5.3.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.0
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0
  local_auth: ^2.1.0
  pin_code_fields: ^8.0.0
  dropdown_button2: ^2.3.9
  dotted_line: ^3.0.0
  blur: ^3.1.0
  google_fonts: ^6.1.0
  animations: ^2.0.7
  percent_indicator: ^4.1.1
  table_calendar: ^3.0.9
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
